name: Publish OfficePlan for Windows

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Signed tag in Stack8871/officePlanFrontend, for example v0.2.0-rc.1
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: officeplan-windows-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Validate source tag
        shell: pwsh
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          if ($env:SOURCE_TAG -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw 'source_tag must be a version tag such as v0.2.0-rc.1'
          }

      - name: Check out public release channel
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: channel
          persist-credentials: true

      - name: Check out private OfficePlan source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Stack8871/officePlanFrontend
          ref: ${{ inputs.source_tag }}
          path: source
          ssh-key: ${{ secrets.OFFICEPLAN_FRONTEND_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Verify immutable source tag
        shell: pwsh
        working-directory: source
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          $headCommit = (git rev-parse HEAD).Trim()
          $tagCommit = (git rev-parse "$env:SOURCE_TAG^{commit}").Trim()
          if ($headCommit -ne $tagCommit) {
            throw "Source tag $env:SOURCE_TAG does not resolve to checked out commit $headCommit"
          }
          $matchingTags = @(git tag --points-at HEAD)
          if ($matchingTags -notcontains $env:SOURCE_TAG) {
            throw "Checked out commit is not tagged with $env:SOURCE_TAG"
          }

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: x86_64-pc-windows-msvc

      - name: Install JavaScript dependencies
        working-directory: source
        run: npm ci

      - name: Verify synchronized version
        working-directory: source
        env:
          OFFICEPLAN_RELEASE_TAG: ${{ inputs.source_tag }}
        run: npm run release:verify-version

      - name: Verify frontend
        working-directory: source
        run: npm run verify

      - name: Verify Rust workspace
        working-directory: source/src-tauri
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Build, sign, and publish Windows release
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: source
          tagName: ${{ inputs.source_tag }}
          releaseName: OfficePlan ${{ inputs.source_tag }}
          releaseBody: Internal beta built from private source tag ${{ inputs.source_tag }}. Backup/restore, transactional email, and Windows Authenticode remain separate release gates.
          releaseDraft: false
          prerelease: ${{ contains(inputs.source_tag, '-') }}
          updaterJsonPreferNsis: true
          args: --target x86_64-pc-windows-msvc --bundles nsis

      - name: Publish updater channel manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          $version = $env:SOURCE_TAG.TrimStart('v')
          $channelName = if ($env:SOURCE_TAG.Contains('-')) { 'beta' } else { 'stable' }
          $downloadDirectory = Join-Path $env:RUNNER_TEMP 'officeplan-updater-channel'
          New-Item -ItemType Directory -Path $downloadDirectory -Force | Out-Null
          gh release download $env:SOURCE_TAG --repo $env:GITHUB_REPOSITORY --pattern latest.json --dir $downloadDirectory --clobber

          $downloadedManifest = Join-Path $downloadDirectory 'latest.json'
          $manifest = Get-Content -LiteralPath $downloadedManifest -Raw | ConvertFrom-Json
          if ($manifest.version -ne $version) {
            throw "Updater manifest version $($manifest.version) does not match $version"
          }
          if ($null -eq $manifest.platforms -or @($manifest.platforms.PSObject.Properties).Count -eq 0) {
            throw 'Updater manifest contains no platform artifacts'
          }

          git -C channel pull --ff-only origin main
          $channelDirectory = Join-Path $env:GITHUB_WORKSPACE "channel/channels/$channelName"
          New-Item -ItemType Directory -Path $channelDirectory -Force | Out-Null
          Copy-Item -LiteralPath $downloadedManifest -Destination (Join-Path $channelDirectory 'latest.json') -Force
          git -C channel add -- "channels/$channelName/latest.json"
          git -C channel diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Updater channel $channelName already points to $version"
          } elseif ($LASTEXITCODE -eq 1) {
            git -C channel config user.name 'github-actions[bot]'
            git -C channel config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C channel commit -m "release: update $channelName channel to $env:SOURCE_TAG"
            git -C channel push origin HEAD:main
          } else {
            throw 'Unable to compare updater channel manifest'
          }

      - name: Generate and publish release checksums
        id: checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          $assetDirectory = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          New-Item -ItemType Directory -Path $assetDirectory | Out-Null
          gh release download $env:SOURCE_TAG --repo $env:GITHUB_REPOSITORY --dir $assetDirectory
          $checksumPath = Join-Path $env:GITHUB_WORKSPACE 'SHA256SUMS.txt'
          $lines = Get-ChildItem -LiteralPath $assetDirectory -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              "$hash *$($_.Name)"
            }
          [IO.File]::WriteAllLines($checksumPath, $lines, [Text.UTF8Encoding]::new($false))
          gh release upload $env:SOURCE_TAG $checksumPath --repo $env:GITHUB_REPOSITORY
          "path=$checksumPath" >> $env:GITHUB_OUTPUT

      - name: Attest published release assets
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-checksums: ${{ steps.checksums.outputs.path }}
